name: Fetch candidate photos (Unsplash licence)
on:
  push:
    branches: [img-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p photos && cd photos
          get() { curl -sSL -m 60 -o "$1.jpg" "$2" && echo "$1 $(file -b --mime-type $1.jpg) $(stat -c%s $1.jpg)" || echo "$1 FAILED"; }
          for id in 9QFSXyF2Ipo dGUXKJZGDSg vyagy6HJpVE 1Uwcoo-ttjY 0EhDwwtMDks imfDeYW-YQY 67ruAEYmp4c z-lNmXoXt-k Ciba8rvHYng e3RJy3mkLXU eeijZpKf2Kg fGd8paHzN98 EBcKOqWzc9M Y7mcBJAgytM z9mq3SP9uy4; do
            url=$(curl -sSL -m 30 -A "Mozilla/5.0" "https://unsplash.com/photos/$id" | grep -oE 'https://images\.unsplash\.com/photo-[0-9]+-[0-9a-f]+' | head -1)
            lic=$(curl -sSL -m 30 -A "Mozilla/5.0" "https://unsplash.com/photos/$id" | grep -oE 'Free to use under the|Unsplash\+ License' | head -1)
            echo "$id -> $url [$lic]"
            [ -n "$url" ] && [ "$lic" = "Free to use under the" ] && get "n-$id" "$url?w=2000&q=78&fm=jpg&fit=max"
          done
          # keep only real images, downsized for review
          for f in *.jpg; do case "$(file -b --mime-type $f)" in image/*) ;; *) rm -f "$f";; esac; done
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f photos/u-*.jpg 2>/dev/null; git add -A photos && git commit -m "Candidate photos [skip ci]" && git push
