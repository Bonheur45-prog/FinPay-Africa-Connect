name: Fetch candidate photos (Unsplash licence)
on:
  push:
    branches: [img-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p photos && cd photos
          get() { curl -sSL -m 60 -o "$1.jpg" "$2" && echo "$1 $(file -b --mime-type $1.jpg) $(stat -c%s $1.jpg)" || echo "$1 FAILED"; }
          for id in 1522605033133-c806e4c59806 1593717191400-84f38ee95485 1511283878565-0833bf39de9d 1576814547952-f8531781d7ef 1693902997450-7e912c0d3554 1688989666504-c2de3f266d36 1618828665011-0abd973f7bb8 1572727850654-f50a7ead20df 1611144727915-ef30a08aaeb3; do
            get "n-$id" "https://images.unsplash.com/photo-$id?w=2200&q=78&fm=jpg&fit=max"
          done
          # keep only real images, downsized for review
          for f in *.jpg; do case "$(file -b --mime-type $f)" in image/*) ;; *) rm -f "$f";; esac; done
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A photos && git commit -m "Candidate photos [skip ci]" && git push
