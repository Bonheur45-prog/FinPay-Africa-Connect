name: Diagnose database (read-only)
on:
  push:
    branches: [diag-db]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
      SSH_USER: ${{ secrets.OVH_SSH_USER }}
      SSHPASS: ${{ secrets.OVH_SSH_PASSWORD }}
    steps:
      - name: Check state
        run: |
          set +e
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh && ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -e ssh "$SSH_USER@$SSH_HOST" 'cd ~/finpay && /usr/local/php8.3/bin/php artisan config:clear && /usr/local/php8.3/bin/php artisan view:clear && /usr/local/php8.3/bin/php artisan route:cache && ls bootstrap/cache'
          sleep 3
          for p in /fr /en /admin/login /build/manifest.json; do curl -s -o /tmp/b -D /tmp/h -m 30 "http://finpay-africa.com$p"; echo "$p $(head -1 /tmp/h) $(grep -i x-powered /tmp/h | tr -d '\r') logo=$(grep -c images/brand/logo.png /tmp/b)"; done
          head -c 700 /tmp/b; echo
