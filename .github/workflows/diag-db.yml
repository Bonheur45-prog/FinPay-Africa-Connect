name: Diagnose database (read-only)
on:
  push:
    branches: [diag-db]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Live checks
        run: |
          set +e
          B=http://finpay-africa.com
          for p in / /fr /en /fr/about /en/solutions /en/solutions/cross-border /fr/solutions/diaspora /fr/solutions/api /fr/solutions/cards /fr/solutions/kyc /en/partners /en/investors /fr/contact-us /fr/blog /fr/privacy-policy /fr/solutions/payments /sitemap.xml /robots.txt /admin /admin/login /fr/nope; do
            printf '%-32s %s\n' "$p" "$(curl -s -o /dev/null -m 30 -w '%{http_code} %{redirect_url}' "$B$p")"
          done
          echo "== assets"
          html=$(curl -s -m 30 $B/fr)
          for a in $(echo "$html" | grep -oE '(/build/assets/[^"]+|/media/[^" ]+\.webp|/images/brand/logo\.png)' | sort -u | head -8); do printf '%s %s\n' "$(curl -s -o /dev/null -m 30 -w '%{http_code}' "$B$a")" "$a"; done
          echo "== cookies on contact page (must not be Secure on http)"
          curl -s -m 30 -D - -o /tmp/c.html $B/fr/contact-us | grep -i '^set-cookie' | sed -E 's/=[^;]+/=…/' 
          grep -c 'name="_token"' /tmp/c.html
          echo "== www"
          curl -s -o /dev/null -m 30 -w '%{http_code}\n' http://www.finpay-africa.com/fr
