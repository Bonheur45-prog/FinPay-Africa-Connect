name: Diagnose database (read-only)
on:
  push:
    branches: [diag-db]
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
      SSH_USER: ${{ secrets.OVH_SSH_USER }}
      SSHPASS: ${{ secrets.OVH_SSH_PASSWORD }}
    steps:
      - name: Read-only table listing
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh && ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -e ssh "$SSH_USER@$SSH_HOST" 'cd ~/finpay && /usr/local/php8.3/bin/php -r '"'"'
            require "vendor/autoload.php"; $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $db = Illuminate\Support\Facades\DB::connection();
            $name = $db->getDatabaseName();
            $rows = $db->select("SELECT TABLE_NAME t, TABLE_ROWS r, CREATE_TIME c FROM information_schema.TABLES WHERE TABLE_SCHEMA = ? ORDER BY CREATE_TIME", [$name]);
            foreach ($rows as $x) echo str_pad($x->t, 32), str_pad((string)$x->r, 8), $x->c, "\n";
            echo "--- migrations table rows ---\n";
            try { foreach ($db->select("SELECT id, migration, batch FROM migrations ORDER BY id") as $m) echo $m->id, " ", $m->migration, " batch ", $m->batch, "\n"; } catch (Throwable $e) { echo "no migrations table\n"; }
            echo "--- exact counts of the tables Laravel may have created ---\n";
            foreach (["users","password_reset_tokens","sessions","cache","cache_locks","jobs","job_batches","failed_jobs","settings","media"] as $t) { try { echo $t, ": ", $db->table($t)->count(), "\n"; } catch (Throwable $e) { echo $t, ": absent\n"; } }
          '"'"''
