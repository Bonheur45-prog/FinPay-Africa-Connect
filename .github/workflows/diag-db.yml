name: Diagnose database (read-only)
on:
  push:
    branches: [diag-db]
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
      SSH_USER: ${{ secrets.OVH_SSH_USER }}
      SSHPASS: ${{ secrets.OVH_SSH_PASSWORD }}
    steps:
      - name: Read-only table listing
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p ~/.ssh && ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          set +e
          for h in nsi-monetique.com www.nsi-monetique.com; do echo "== $h"; dig +short A $h; curl -skI -m 20 "https://$h/" | grep -iE '^(HTTP|server|x-powered|set-cookie: [a-z_-]+)' | cut -c1-60; curl -skL -m 20 -o /dev/null -w 'final=%{url_effective} code=%{http_code}\n' "https://$h/"; done
          echo "== finpay hosting web IP: 5.135.23.164"
          echo "== recently used files in this hosting's www (who is reading it?)"
          sshpass -e ssh "$SSH_USER@$SSH_HOST" 'set +e; ls -la ~/nordsud-app/storage/logs 2>/dev/null | tail -5; tail -c 600 ~/nordsud-app/storage/logs/laravel.log 2>/dev/null | tail -3; grep -E "^(APP_URL|DB_HOST|DB_DATABASE|DB_PREFIX)=" ~/nordsud-app/.env 2>/dev/null | sed -E "s/(DB_DATABASE=).*/\1<hidden>/"'
